name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

# Repository variables, not secrets: none of these are sensitive, and secrets
# are masked in logs, which makes a failed sync print s3://*** and unreadable.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  BUCKET: ${{ vars.SITE_BUCKET }}
  DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Unset variables expand to empty, which would otherwise fail as
      # "s3://" only after a full build.
      - name: Check required variables
        run: |
          for v in BUCKET DISTRIBUTION_ID DEPLOY_ROLE_ARN; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable for $v is not set."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build static site
        run: pnpm nuxt generate

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # _nuxt and _fonts are content-hashed, so they can be cached forever.
      - name: Upload immutable assets
        run: |
          aws s3 sync .output/public "s3://$BUCKET" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "_nuxt/*" --include "_fonts/*"

      # --delete belongs here only. On the first pass, --exclude "*" would scope
      # the delete scan to _nuxt and prune every HTML file in the bucket.
      - name: Upload HTML and payloads
        run: |
          aws s3 sync .output/public "s3://$BUCKET" --delete \
            --cache-control "no-cache" \
            --exclude "_nuxt/*" --exclude "_fonts/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
